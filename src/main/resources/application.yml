spring:
  application:
    name: ai-interview-assistant

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:interview_db}
    username: ${DB_USER:interview}
    password: ${DB_PASSWORD:interview}
    hikari:
      maximum-pool-size: 10

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Resumes and JDs are small documents
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
