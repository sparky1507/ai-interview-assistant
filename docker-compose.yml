services:
  postgres:
    # Official Postgres 17 image with the pgvector extension pre-installed
    image: pgvector/pgvector:pg17
    container_name: interview-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-interview_db}
      POSTGRES_USER: ${DB_USER:-interview}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-interview}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-interview} -d ${DB_NAME:-interview_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Free, local LLM + embeddings. Optional: only starts with `docker compose --profile ollama up -d`
  # (set AI_PROVIDER=ollama in .env). Pull models once with:
  #   docker exec interview-ollama ollama pull mxbai-embed-large
  ollama:
    image: ollama/ollama:0.40.6
    container_name: interview-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      # Downloaded models survive container restarts/recreation
      - ollama-models:/root/.ollama
    # Uncomment to use an NVIDIA GPU (needs Docker Desktop with WSL2 GPU support); CPU works for embeddings
    # gpus: all

volumes:
  pgdata:
  ollama-models:
